[tox]
envlist = py39, py310, py311, py312, py313, py314
skip_missing_interpreters = true
# The library is imported from local source via the per-module `lib` symlink
# (tests/<module>/lib -> repo root), so tox must not build or install the
# package. The supported minimum is Python 3.9 (requires-python = ">=3.9"):
# below that, stdlib `zoneinfo` (time/db_sqlite/version) and parenthesized
# `with` statements (url/lftest) are unavailable, so 3.6-3.8 are not in the
# matrix.
no_package = true

[testenv]
# Each environment installs the hash-pinned lockfile of its Python version, so
# the tests run against exactly the dependencies the library ships with, and
# every runtime dependency is there: a module whose dependency was missing
# skipped its tests without anyone noticing.
deps =
    py39: -r lockfiles/py39/requirements.txt
    py310: -r lockfiles/py310/requirements.txt
    py311: -r lockfiles/py311/requirements.txt
    py312: -r lockfiles/py312/requirements.txt
    py313: -r lockfiles/py313/requirements.txt
    py314: -r lockfiles/py314/requirements.txt
commands =
    python tools/run-unit-tests --no-container {posargs}
