name: 'Linuxfabrik: Publish to PyPI'

on:
  release:
    types:
      - 'published'

permissions:
  contents: 'read'

jobs:
  build:
    name: 'Build package'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Set up Python'
        uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' # v7.0.0
        with:
          python-version: '3.12'

      - name: 'Install build tools'
        run: 'pip install --require-hashes --requirement .github/release/requirements.txt'

      # Without isolation, so the package is built by the hash-pinned setuptools
      # and wheel installed above instead of by whatever version an isolated build
      # would fetch.
      - name: 'Build package'
        run: 'python -m build --no-isolation'

      - name: 'Upload build artifacts'
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          name: 'dist'
          path: 'dist/'

  publish-testpypi:
    name: 'Publish to TestPyPI'
    needs: 'build'
    runs-on: 'ubuntu-latest'
    environment:
      name: 'testpypi'
      url: 'https://test.pypi.org/project/linuxfabrik-lib/'
    permissions:
      id-token: 'write'
    steps:
      - name: 'Download build artifacts'
        uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333' # v8.0.2
        with:
          name: 'dist'
          path: 'dist/'

      - name: 'Publish to TestPyPI'
        uses: 'pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086' # v1.14.3
        with:
          repository-url: 'https://test.pypi.org/legacy/'

  publish-pypi:
    name: 'Publish to PyPI'
    needs: 'publish-testpypi'
    runs-on: 'ubuntu-latest'
    environment:
      name: 'pypi'
      url: 'https://pypi.org/project/linuxfabrik-lib/'
    permissions:
      id-token: 'write'
    steps:
      - name: 'Download build artifacts'
        uses: 'actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333' # v8.0.2
        with:
          name: 'dist'
          path: 'dist/'

      - name: 'Publish to PyPI'
        uses: 'pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086' # v1.14.3

  # Lets the Monitoring Plugins pin the new version in all their lockfiles
  # (`lf-update-lib.yml` there). Sent with the Linuxfabrik automation app, since
  # GITHUB_TOKEN cannot reach another repository.
  dispatch-monitoring-plugins:
    name: 'Notify the Monitoring Plugins'
    needs: 'publish-pypi'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Generate app token'
        id: 'app-token'
        uses: 'actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510' # v3.3.0
        with:
          client-id: '${{ vars.LF_AUTOMATION_CLIENT_ID }}'
          private-key: '${{ secrets.LF_AUTOMATION_APP_PRIVATE_KEY }}'
          repositories: 'monitoring-plugins'

      - name: 'Dispatch lib-release to Linuxfabrik/monitoring-plugins'
        env:
          GH_TOKEN: '${{ steps.app-token.outputs.token }}'
          TAG: '${{ github.event.release.tag_name }}'
        run: |
          gh api repos/Linuxfabrik/monitoring-plugins/dispatches \
            --raw-field event_type='lib-release' \
            --raw-field "client_payload[version]=${TAG#v}"
