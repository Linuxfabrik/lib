name: 'Linuxfabrik: Run the unit tests'

# Nothing ran the test suite here until now: a push landed on `main` and whether
# the suite still passed depended on someone remembering to run it. Two stale
# assertions in `tests/librenms` and `tests/wildfly` sat red for weeks that way,
# and the tox matrix would not have caught them either, because it only reaches
# what `tools/run-unit-tests --no-container` selects.
#
# The container tests stay out. They build images, take minutes per module and
# need podman, none of which belongs in the check that gates a pull request;
# `tools/run-container-tests` drives those separately.

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

permissions: read-all

# A branch that gets two pushes in a row only needs the newer one tested.
concurrency:
  group: 'unit-tests-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  unit-tests:
    name: 'Python ${{ matrix.python-version }}'
    runs-on: 'ubuntu-latest'
    strategy:
      # One version failing is a fact about that version, so let the others
      # finish and report rather than cancelling them.
      fail-fast: false
      matrix:
        # The supported range from `pyproject.toml`, floor first: RHEL 8 ships
        # Python 3.9, and a module that quietly grows newer syntax breaks there.
        python-version:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
    steps:
      - name: 'Harden the runner (Audit all outbound calls)'
        uses: 'step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1' # v2.21.1
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1

      - name: 'Set up Python ${{ matrix.python-version }}'
        uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' # v7.0.0
        with:
          python-version: '${{ matrix.python-version }}'

      - name: 'Install tox'
        run: 'pip install tox'

      # Through tox rather than calling the runner directly: `tox.ini` already
      # lists the runtime dependencies of the modules under test, and a second
      # copy of that list here would drift from it.
      - name: 'Run the unit tests'
        env:
          PYTHON_VERSION: '${{ matrix.python-version }}'
        run: 'tox -e "py${PYTHON_VERSION//./}"'
